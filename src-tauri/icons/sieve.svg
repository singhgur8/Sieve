<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Sieve app icon source: regenerate the icon set with `pnpm tauri icon src-tauri/icons/sieve.svg`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f36"/>
      <stop offset="1" stop-color="#15171b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc857"/>
      <stop offset="1" stop-color="#f08a24"/>
    </linearGradient>
    <clipPath id="bowl"><circle cx="512" cy="512" r="262"/></clipPath>
  </defs>
  <!-- macOS icon grid: 824 px rounded square centred on the 1024 canvas. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- Mesh: a grid of holes clipped to the sieve bowl. -->
  <g clip-path="url(#bowl)" fill="#e9ecef" opacity="0.9">
    <g id="row">
      <circle cx="272" cy="0" r="22"/><circle cx="352" cy="0" r="22"/><circle cx="432" cy="0" r="22"/>
      <circle cx="512" cy="0" r="22"/><circle cx="592" cy="0" r="22"/><circle cx="672" cy="0" r="22"/>
      <circle cx="752" cy="0" r="22"/>
    </g>
    <use href="#row" y="272"/><use href="#row" y="352"/><use href="#row" y="432"/><use href="#row" y="512"/>
    <use href="#row" y="592"/><use href="#row" y="672"/><use href="#row" y="752"/>
  </g>
  <!-- Rim of the sieve. -->
  <circle cx="512" cy="512" r="286" fill="none" stroke="url(#rim)" stroke-width="56"/>
  <!-- One highlighted "keeper" hole. -->
  <circle cx="592" cy="432" r="34" fill="#ffc857"/>
</svg>
