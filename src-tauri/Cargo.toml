[package]
name = "lumenraw"
version = "0.1.0"
description = "LumenRAW — local RAW culling, editing and export"
authors = ["Gurjot Singh"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumenraw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
thiserror = "2.0.21"
walkdir = "2.5.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
# Ingest pipeline (rust-engine-dev). LibRaw and TurboJPEG (libjpeg-turbo 3) are linked
# dynamically by build.rs from Homebrew (`brew install libraw` pulls in jpeg-turbo).
rayon = "1.10"
fast_image_resize = "6"
# Culling engine (vision-ml-dev): ONNX Runtime 1.28 (prebuilt, statically linked by ort-sys)
# with the CoreML execution provider; CPU EP is the fallback.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-27", "coreml"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
libc = "0.2"
